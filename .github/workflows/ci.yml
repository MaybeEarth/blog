name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Build, Lint, Typecheck and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${ runner.os }-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Database & Prisma
        env:
          DATABASE_URL: postgresql://blog:change_me@localhost:5432/blog
          DIRECT_URL: postgresql://blog:change_me@localhost:5432/blog
        run: |
          pnpm --filter @blog/api prisma:generate
          pnpm --filter @blog/api prisma db push --skip-generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Turbo Build
        run: pnpm build

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://blog:change_me@localhost:5432/blog
          DIRECT_URL: postgresql://blog:change_me@localhost:5432/blog
          REDIS_CACHE_URL: redis://localhost:6379
          REDIS_QUEUE_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_access_secret_super_secure_32chars__
          JWT_REFRESH_SECRET: test_refresh_secret_super_secure_32char
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: media
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: change_me_minio
        run: pnpm test
