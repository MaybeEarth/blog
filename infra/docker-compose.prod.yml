services:
  # 1. PostgreSQL 17
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # 2. PgBouncer
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      DB_USER: ${POSTGRES_USER:-blog}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-blog}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_IDLE_TIMEOUT: "600"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # 3. Redis Cache (LRU)
  redis-cache:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # 4. Redis Queue (BullMQ Persistent)
  redis-queue:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redisqueue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # 5. S3 Uyumlu Depolama (RustFS)
  s3:
    image: rustfs/rustfs:latest
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-change_me_s3_secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - s3data:/data
    networks:
      - internal

  # 6. NestJS API Backend
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:-change_me_in_prod}@pgbouncer:5432/${POSTGRES_DB:-blog}?pgbouncer=true&connection_limit=15
      DIRECT_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/${POSTGRES_DB:-blog}
      REDIS_CACHE_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_32chars__}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_32chars_}
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change_me_s3_secret}
      S3_BUCKET: media
      S3_PUBLIC_URL: /media
      DEFAULT_LOCALE: tr
      ENABLED_LOCALES: tr,en
    depends_on:
      pgbouncer:
        condition: service_started
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      s3:
        condition: service_started
    networks:
      - internal

  # 7. React Admin Dashboard (SPA)
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: always
    networks:
      - internal

  # 8. Next.js 15 Web Frontend (SSR / ISR)
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      INTERNAL_API_URL: http://api:3001/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    depends_on:
      - api
    networks:
      - internal

  # 9. Nginx Reverse Proxy & HTTP Microcaching
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
      - api
      - admin
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisqueue:
  s3data:
  nginx_cache:
