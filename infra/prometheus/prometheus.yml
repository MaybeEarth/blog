global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'blog_api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:3001']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis_cache'
    static_configs:
      - targets: ['redis-exporter-cache:9121']

  - job_name: 'redis_queue'
    static_configs:
      - targets: ['redis-exporter-queue:9121']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
